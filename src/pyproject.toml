[project]
name = "car_detection"
version = "0.1.0"
description = " Car detection ML pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "graphviz>=0.20.3",
    "matplotlib>=3.10.1",
    "numpy>=2.2.3",
    "pillow>=11.1.0",
    "torchview>=0.2.6",
    "pandas>=3.0.2",
    "albumentations>=2.0.8",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
    "scikit-image>=0.26.0",
    "ipykernel>=7.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
  "jupyterlab",
  "ipykernel",
  "ruff",
  "mypy",
]
